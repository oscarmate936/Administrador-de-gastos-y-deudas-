name: APK de Android

# Compila el APK firmado con la llave fija guardada en los secretos del repositorio.
# - En main: publica el APK como Release (se descarga desde la página de Releases).
# - En las ramas de trabajo: deja el APK como artefacto de la ejecución.

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que estén los secretos de la firma
        env:
          FIRMA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          CLAVE: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$FIRMA" ] || [ -z "$CLAVE" ]; then
            echo "::error::Faltan los secretos ANDROID_KEYSTORE_BASE64 y ANDROID_KEYSTORE_PASSWORD (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm test
      - run: npm run build:android

      - name: Escribir la llave en un archivo temporal
        env:
          FIRMA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$FIRMA" | base64 --decode > "$RUNNER_TEMP/firma.jks"

      - name: Compilar el APK firmado
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/firma.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Borrar la llave temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/firma.jks"

      - name: Nombrar el APK con su versión
        id: apk
        run: |
          version=$(node -p "require('./package.json').version")
          nombre="MisFinanzas-$version.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$nombre"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "nombre=$nombre" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.nombre }}
          path: ${{ steps.apk.outputs.nombre }}
          retention-days: 30

      - name: Publicar Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          etiqueta="v${{ steps.apk.outputs.version }}-${{ github.run_number }}"
          gh release create "$etiqueta" "${{ steps.apk.outputs.nombre }}" \
            --target "$GITHUB_SHA" \
            --title "Mis Finanzas ${{ steps.apk.outputs.version }}" \
            --notes "APK firmado con la llave fija. Se instala encima de la versión anterior sin borrar los datos."
